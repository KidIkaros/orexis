name: release

# The release pipeline (ADR-0019, ticket 020): a tag push builds every
# target, signs the artifacts with minisign, and publishes the release
# with the signed manifest. The private key is a CI secret; local builds
# are never published.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 cross-compiler on x86_64 Linux
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Install minisign
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install minisign; else sudo apt-get update && sudo apt-get install -y minisign; fi
      - name: Restore the signing key
        run: |
          printf '%s\n' "${{ secrets.OREXIS_SIGNING_KEY }}" > "$RUNNER_TEMP/signing.key"
          chmod 600 "$RUNNER_TEMP/signing.key"
          echo "OREXIS_SIGNING_KEY=$RUNNER_TEMP/signing.key" >> "$GITHUB_ENV"
      - name: Build, archive, checksum, sign
        run: bash scripts/release.sh archive ${{ matrix.target }} "dist/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Install minisign
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install minisign; else sudo apt-get update && sudo apt-get install -y minisign; fi
      - name: Restore the signing key
        run: |
          printf '%s\n' "${{ secrets.OREXIS_SIGNING_KEY }}" > "$RUNNER_TEMP/signing.key"
          chmod 600 "$RUNNER_TEMP/signing.key"
          echo "OREXIS_SIGNING_KEY=$RUNNER_TEMP/signing.key" >> "$GITHUB_ENV"
      - name: Build, archive, checksum, sign desktop
        run: bash scripts/release.sh desktop ${{ matrix.target }} "dist/desktop-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop-${{ matrix.target }}/

  publish:
    needs: [archive, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Restore the signing key
        run: |
          printf '%s\n' "${{ secrets.OREXIS_SIGNING_KEY }}" > "$RUNNER_TEMP/signing.key"
          chmod 600 "$RUNNER_TEMP/signing.key"
          echo "OREXIS_SIGNING_KEY=$RUNNER_TEMP/signing.key" >> "$GITHUB_ENV"
      - name: Flatten the artifact directories
        run: |
          mkdir -p artifacts
          find dist -name '*.tar.gz*' -exec mv {} artifacts/ \;
      - name: Build and sign the manifest
        env:
          OREXIS_RELEASE_REPO: ${{ github.repository }}
        run: bash scripts/release.sh manifest artifacts publish
      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "orexis ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            publish/latest.json publish/latest.json.minisig \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256 artifacts/*.tar.gz.minisig
        env:
          GH_TOKEN: ${{ github.token }}
