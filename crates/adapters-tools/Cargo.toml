[package]
name = "orexis-adapters-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orexis-core.workspace = true
orexis-ports.workspace = true
async-trait.workspace = true
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
