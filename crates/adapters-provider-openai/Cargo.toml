[package]
name = "orexis-adapters-provider-openai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orexis-core.workspace = true
orexis-ports.workspace = true
orexis-adapters-provider-catalog.workspace = true
