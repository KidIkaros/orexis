[package]
name = "orexis-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orexis-core.workspace = true
orexis-ports.workspace = true
orexis-protocol.workspace = true
orexis-usecases.workspace = true
orexis-adapters-session-sqlite.workspace = true
orexis-adapters-fake.workspace = true
orexis-adapters-codec.workspace = true
orexis-adapters-tools.workspace = true
orexis-adapters-protocol-mcp.workspace = true
orexis-adapters-protocol-acp.workspace = true
orexis-adapters-jsonrpc.workspace = true
orexis-composition.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
futures = "0.3"
orexis-adapters-entity-sqlite = { path = "../adapters-entity-sqlite" }
orexis-adapters-evolution-git = { path = "../adapters-evolution-git" }
