id: groq
display_name: Groq
kind: openai_compatible
base_url: https://api.groq.com/openai/v1
auth:
  kind: api_key
  env: [GROQ_API_KEY]
  header: authorization
  prefix: "Bearer "
wire:
  dialect: open_ai
  tool_format: native
  stream_format: sse
capabilities:
  tools: true
  parallel_tools: true
  vision: false
  json_mode: true
  reasoning: false
models:
  - id: llama-3.3-70b-versatile
    context: 131072
    max_output: 32768
limits:
  max_concurrency: 4
fallbacks: []
