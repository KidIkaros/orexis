[workspace]
exclude = ["crates/desktop"]
members = [
    "crates/core",
    "crates/ports",
    "crates/protocol",
    "crates/client",
    "crates/desktop-core",
    "crates/usecases",
    "crates/adapters-fake",
    "crates/adapters-session-sqlite",
    "crates/adapters-provider-catalog",
    "crates/adapters-provider-openai",
    "crates/adapters-codec",
    "crates/adapters-tools",
    "crates/adapters-lsp",
    "crates/adapters-skills",
    "crates/adapters-tui",
    "crates/daemon",
    "crates/adapters-context-fs",
    "crates/adapters-provider-llamacpp",
    "crates/adapters-provider-anthropic",
    "crates/adapters-http",
    "crates/composition",
    "crates/slice",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
orexis-core = { path = "crates/core" }
orexis-ports = { path = "crates/ports" }
orexis-protocol = { path = "crates/protocol" }
orexis-client = { path = "crates/client" }
orexis-desktop-core = { path = "crates/desktop-core" }
orexis-usecases = { path = "crates/usecases" }
orexis-adapters-fake = { path = "crates/adapters-fake" }
orexis-adapters-session-sqlite = { path = "crates/adapters-session-sqlite" }
orexis-adapters-provider-catalog = { path = "crates/adapters-provider-catalog" }
orexis-adapters-provider-openai = { path = "crates/adapters-provider-openai" }
orexis-adapters-codec = { path = "crates/adapters-codec" }
orexis-adapters-tools = { path = "crates/adapters-tools" }
orexis-adapters-lsp = { path = "crates/adapters-lsp" }
orexis-adapters-tui = { path = "crates/adapters-tui" }
orexis-daemon = { path = "crates/daemon" }
orexis-adapters-context-fs = { path = "crates/adapters-context-fs" }
orexis-adapters-provider-llamacpp = { path = "crates/adapters-provider-llamacpp" }
orexis-adapters-provider-anthropic = { path = "crates/adapters-provider-anthropic" }
orexis-adapters-http = { path = "crates/adapters-http" }
orexis-composition = { path = "crates/composition" }
async-trait = "0.1"
futures = "0.3"
